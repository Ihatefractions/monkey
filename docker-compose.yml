version: '3.9'
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - DATABASE_PATH=/data/chat.db
    ports:
      - "4000:4000"
    volumes:
      - server_data:/data
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=http://localhost:4000/api
      - VITE_SOCKET_BASE=http://localhost:4000
    ports:
      - "5173:80"
volumes:
  server_data: {}

